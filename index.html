<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>وجباتي - Wajabaty VIP</title>
  <style>
    :root {
      --bg-main: #0b0c10;
      --bg-card: #14161d;
      --bg-elevated: #1e212b;
      --primary: #ff2a5f;
      --primary-glow: rgba(255, 42, 95, 0.4);
      --accent-orange: #ff5722;
      --accent-green: #00e676;
      --accent-blue: #00b0ff;
      --accent-purple: #9c27b0;
      --text-main: #ffffff;
      --text-muted: #8c93a8;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 150px;
      user-select: none;
      overflow-x: hidden;
    }

    #toastBox {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(20, 22, 29, 0.95);
      border: 1px solid var(--accent-green);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toastBox.show { transform: translateX(-50%) translateY(0); }

    .live-alert-bar {
      margin: 10px 14px 6px;
      background: linear-gradient(135deg, rgba(255, 42, 95, 0.95), rgba(255, 152, 0, 0.95));
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(255, 42, 95, 0.35);
      cursor: pointer;
      animation: pulseGlow 2.2s infinite alternate;
      position: relative;
      z-index: 500;
    }
    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 42, 95, 0.3); }
      to { transform: scale(1.015); box-shadow: 0 8px 25px rgba(255, 152, 0, 0.5); }
    }
    .live-alert-content { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
    .live-alert-badge {
      background: #fff;
      color: var(--primary);
      font-weight: 900;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .live-alert-text { display: flex; flex-direction: column; min-width: 0; }
    .live-alert-text strong { font-size: 12px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-alert-text span { font-size: 11px; color: #ffe6ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
    .btn-live-alert-action {
      background: #111;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }
    .live-alert-close {
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      padding: 2px 6px;
    }

    .banner-slider-container {
      margin: 10px 14px 12px;
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      height: 160px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: #14161d;
    }
    .banner-slides-track { display: flex; height: 100%; transition: transform 0.5s ease; }
    .banner-slide { min-width: 100%; position: relative; height: 100%; }
    .banner-slide img, .banner-slide video { width: 100%; height: 100%; object-fit: cover; }
    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(11,12,16,0.92) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 18px;
    }
    .banner-overlay h2 { font-size: 19px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .banner-overlay p { font-size: 12px; color: #e0e0e0; font-weight: 700; }
    .banner-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }
    .banner-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: all 0.3s ease;
    }
    .banner-dot.active { background: var(--primary); width: 22px; border-radius: 10px; }

    .control-header {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 6px 14px 12px; 
      gap: 6px;
    }
    .brand-pill {
      display: flex; 
      align-items: center; 
      gap: 6px;
      background: var(--bg-card); 
      padding: 8px 14px; 
      border-radius: 16px;
      border: 1px solid var(--border-color); 
      font-weight: 900; 
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .brand-pill:active { transform: scale(0.95); }
    .brand-badge {
      background: var(--primary); 
      color: white; 
      border-radius: 8px;
      padding: 2px 6px; 
      font-size: 11px; 
      font-weight: 900;
    }
    .header-actions { display: flex; gap: 6px; }
    
    .btn-wheel-header {
      background: linear-gradient(135deg, #9c27b0, #e91e63);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: none; 
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.35);
      animation: pulseWheel 2s infinite alternate;
    }
    @keyframes pulseWheel {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .btn-cuisines-filter {
      background: linear-gradient(135deg, #ff5722, #ff9800);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-discount {
      background: linear-gradient(135deg, #ff9800, #ffb300);
      color: #111; 
      border: none; 
      padding: 8px 12px; 
      border-radius: 14px;
      font-size: 12px; 
      font-weight: 900; 
      cursor: pointer;
    }
    .btn-cart-top {
      background: rgba(255, 42, 95, 0.15); 
      color: var(--primary);
      border: 1px solid var(--primary); 
      padding: 8px 12px; 
      border-radius: 14px;
      font-size: 12px; 
      font-weight: 900; 
      cursor: pointer;
    }

    .search-wrapper { display: flex; gap: 8px; margin: 0 14px 12px; }
    .search-input-box { flex: 1; position: relative; }
    .search-input-box input {
      width: 100%; 
      background: var(--bg-card); 
      border: 1px solid var(--border-color);
      padding: 12px 16px; 
      border-radius: 16px; 
      color: white; 
      outline: none; 
      font-size: 13px;
    }
    .btn-search {
      background: var(--primary); 
      color: white; 
      border: none;
      padding: 0 20px; 
      border-radius: 16px; 
      font-weight: 900; 
      cursor: pointer;
    }

    .zones-bar { display: flex; gap: 8px; margin: 0 14px 10px; }
    .zone-chip {
      flex: 1; 
      padding: 9px 4px; 
      background: var(--bg-card);
      border: 1px solid var(--border-color); 
      border-radius: 14px;
      color: var(--text-muted); 
      font-size: 12px; 
      font-weight: 800; 
      text-align: center; 
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .zone-chip.active {
      background: var(--primary); 
      color: white; 
      border-color: var(--primary);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .horizontal-pills {
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      white-space: nowrap;
      padding: 0 14px 10px; 
      scrollbar-width: none; 
      -webkit-overflow-scrolling: touch;
    }
    .horizontal-pills::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; 
      padding: 8px 16px; 
      border-radius: 20px;
      background: var(--bg-card); 
      border: 1px solid var(--border-color);
      color: var(--text-muted); 
      font-size: 12px; 
      font-weight: 700; 
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pill.active-white { background: #ffffff; color: #111; font-weight: 900; border-color: #fff; }
    .pill.active-green { background: var(--accent-green); color: #111; font-weight: 900; border-color: var(--accent-green); }

    /* كروت الوجبات */
    .meals-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 4px 14px;
      min-height: 200px;
    }
    .meal-card-talabaty {
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--border-color);
      display: flex;
      padding: 12px;
      gap: 12px;
      align-items: center;
      position: relative;
      transition: transform 0.15s ease;
    }
    .meal-card-talabaty.out-of-stock {
      opacity: 0.65;
      border-color: rgba(255, 42, 95, 0.35);
    }
    .meal-card-talabaty.out-of-stock .talabaty-img-box img {
      filter: grayscale(0.9);
    }
    .talabaty-img-box {
      width: 95px;
      height: 95px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      background: #1a1c24;
    }
    .talabaty-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .soldout-badge-overlay {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(220, 20, 60, 0.95);
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 6px;
      z-index: 5;
    }
    .btn-quick-add {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      color: var(--primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn-quick-add:active { transform: scale(0.9); }
    .talabaty-info-box {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .talabaty-title { font-size: 14px; font-weight: 900; color: #ffffff; line-height: 1.3; }
    .talabaty-desc {
      font-size: 11px;
      color: #9aa1b5;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .talabaty-rest-tag { font-size: 10px; color: var(--accent-orange); font-weight: 800; }
    .talabaty-pricing {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .talabaty-main-price { font-size: 14px; font-weight: 900; color: var(--accent-green); }
    .talabaty-old-price { font-size: 11px; color: #8c93a8; text-decoration: line-through; font-weight: 700; }
    .talabaty-pro-badge {
      background: rgba(156, 39, 176, 0.25);
      border: 1px solid #ab47bc;
      color: #e1bee7;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
    }

    /* عجلة الحظ */
    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 26px;
      color: #ff2a5f;
      z-index: 10;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    /* نافذة المطابخ */
    .cuisines-drawer-box {
      background: #14161f;
      width: 100%;
      max-width: 500px;
      border-radius: 26px 26px 0 0;
      border: 1.5px solid var(--border-color);
      border-bottom: none;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s ease-out;
      padding-bottom: 20px;
    }
    .cuisines-header {
      padding: 16px 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .cuisines-header-title { font-size: 17px; font-weight: 900; }
    .btn-clear-cuisines {
      background: none;
      border: none;
      color: var(--accent-orange);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .cuisines-search-wrap { padding: 12px 18px 8px; }
    .cuisines-search-input {
      width: 100%;
      background: #1a1c26;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .cuisines-list-body { flex: 1; overflow-y: auto; padding: 4px 18px 12px; }
    .cuisine-row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }
    .cuisine-row-label { font-size: 14px; font-weight: 800; color: #e0e4ef; }
    .cuisine-checkbox { width: 20px; height: 20px; border-radius: 6px; accent-color: var(--accent-orange); cursor: pointer; }
    .btn-apply-cuisines {
      background: linear-gradient(135deg, #ff5722, #f4511e);
      color: #fff;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 87, 34, 0.4);
    }

    /* السلة العائمة */
    .float-cart-bar {
      position: fixed; 
      bottom: 75px; 
      left: 14px; 
      right: 14px;
      background: rgba(22, 25, 34, 0.95); 
      border: 1.5px solid var(--primary);
      border-radius: 20px; 
      padding: 11px 16px; 
      display: none;
      justify-content: space-between; 
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
      z-index: 1000;
      backdrop-filter: blur(12px);
    }
    .float-cart-bar.show { display: flex; }
    .cart-total-badge { color: var(--accent-green); font-weight: 900; font-size: 15px; }
    .btn-open-vip-cart {
      background: var(--primary); 
      color: white; 
      border: none;
      padding: 9px 18px; 
      border-radius: 14px; 
      font-weight: 900; 
      font-size: 13px; 
      cursor: pointer;
    }

    .cart-drawer-backdrop {
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px); 
      display: none; 
      align-items: flex-end;
      justify-content: center; 
      z-index: 2500;
    }
    .cart-drawer-backdrop.show { display: flex; }
    .cart-drawer-box {
      background: #14161f; 
      width: 100%; 
      max-width: 520px;
      border-radius: 26px 26px 0 0; 
      border: 1.5px solid var(--border-color);
      border-bottom: none; 
      max-height: 88vh; 
      display: flex; 
      flex-direction: column;
      animation: slideUp 0.25s ease-out; 
      padding-bottom: 25px;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .drawer-header {
      padding: 16px 18px 12px; 
      display: flex; 
      justify-content: space-between;
      align-items: center; 
      border-bottom: 1px solid var(--border-color);
    }
    .drawer-title { font-size: 17px; font-weight: 900; margin: 0; }
    .btn-close-drawer {
      background: rgba(255,255,255,0.08); 
      border: none; 
      color: #fff;
      width: 32px; 
      height: 32px; 
      border-radius: 50%; 
      font-size: 16px;
      cursor: pointer;
    }
    .drawer-body { padding: 14px 18px; overflow-y: auto; flex: 1; }

    .cart-item-row {
      background: var(--bg-card); 
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md); 
      padding: 10px 12px; 
      margin-bottom: 10px;
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 10px;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-title { font-size: 13px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item-rest { font-size: 11px; color: var(--accent-orange); margin-top: 2px; }
    .cart-item-price { font-size: 13px; font-weight: 900; color: var(--accent-green); margin-top: 3px; }
    .cart-qty-ctrl { display: flex; align-items: center; gap: 8px; }
    .btn-qty {
      width: 28px; 
      height: 28px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color);
      background: var(--bg-elevated); 
      color: #fff; 
      font-size: 15px; 
      font-weight: 900;
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    .qty-num { font-size: 14px; font-weight: 900; min-width: 18px; text-align: center; }

    .form-input {
      width: 100%; 
      background: #191c25; 
      border: 1px solid var(--border-color);
      padding: 12px 14px; 
      border-radius: 14px; 
      color: white; 
      margin-bottom: 9px; 
      font-size: 13px; 
      outline: none;
    }
    .form-input:focus { border-color: var(--primary); }
    .btn-gps-loc {
      width: 100%; 
      background: rgba(0, 230, 118, 0.12); 
      color: var(--accent-green);
      border: 1px dashed var(--accent-green); 
      border-radius: 14px; 
      padding: 12px;
      font-size: 13px; 
      font-weight: 800; 
      cursor: pointer; 
      display: flex;
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      margin-bottom: 12px;
    }
    .bill-summary-card {
      background: #0f1015; 
      border-radius: 14px; 
      padding: 12px 14px;
      border: 1px solid var(--border-color); 
      font-size: 12px; 
      margin-bottom: 14px;
    }
    .bill-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .bill-row.total {
      border-top: 1px dashed rgba(255,255,255,0.15); 
      padding-top: 8px; 
      margin-top: 8px;
      font-size: 15px; 
      font-weight: 900; 
      color: var(--accent-green);
    }

    .btn-submit-order-wa {
      width: 100%; 
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 16px;
      font-weight: 900; 
      font-size: 15px; 
      cursor: pointer; 
      display: flex;
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35); 
    }

    .modal-backdrop {
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px); 
      display: none; 
      align-items: center;
      justify-content: center; 
      z-index: 3000; 
      padding: 14px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-box {
      background: #161822; 
      width: 100%; 
      max-width: 460px;
      border-radius: 24px; 
      padding: 20px; 
      border: 1.5px solid var(--border-color);
      max-height: 92vh;
      overflow-y: auto;
    }

    .admin-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      background: var(--bg-main);
      padding: 5px;
      border-radius: 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
    }
    .admin-tab-btn.active { background: var(--primary); color: #fff; }
    .admin-tab-content { display: none; }
    .admin-tab-content.active { display: block; }

    /* أزرار قفل وحذف الوجبات */
    .btn-stock-toggle {
      border: none;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .btn-stock-toggle.in-stock { background: rgba(0, 230, 118, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); }
    .btn-stock-toggle.out-of-stock { background: rgba(255, 42, 95, 0.2); border: 1px solid var(--primary); color: #ff4d6d; }

    .admin-stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .admin-stat-card {
