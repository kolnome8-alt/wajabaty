<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>وجباتي - Wajabaty VIP</title>
  <style>
    :root {
      --bg-main: #0b0c10;
      --bg-card: #14161d;
      --bg-elevated: #1e212b;
      --primary: #ff2a5f;
      --primary-glow: rgba(255, 42, 95, 0.4);
      --accent-orange: #ff5722;
      --accent-green: #00e676;
      --accent-blue: #00b0ff;
      --accent-purple: #9c27b0;
      --text-main: #ffffff;
      --text-muted: #8c93a8;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 150px;
      user-select: none;
      overflow-x: hidden;
    }

    #toastBox {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(20, 22, 29, 0.95);
      border: 1px solid var(--accent-green);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toastBox.show { transform: translateX(-50%) translateY(0); }

    .banner-slider-container {
      margin: 10px 14px 12px;
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      height: 160px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: #14161d;
    }
    .banner-slides-track { display: flex; height: 100%; transition: transform 0.5s ease; }
    .banner-slide { min-width: 100%; position: relative; height: 100%; }
    .banner-slide img { width: 100%; height: 100%; object-fit: cover; }
    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(11,12,16,0.92) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 18px;
    }
    .banner-overlay h2 { font-size: 19px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .banner-overlay p { font-size: 12px; color: #e0e0e0; font-weight: 700; }
    .banner-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }
    .banner-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: all 0.3s ease;
    }
    .banner-dot.active { background: var(--primary); width: 22px; border-radius: 10px; }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px 12px;
      gap: 6px;
    }
    .brand-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      padding: 8px 14px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }
    .brand-badge {
      background: var(--primary);
      color: white;
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 900;
    }
    .header-actions { display: flex; gap: 6px; }

    .btn-wheel-header {
      background: linear-gradient(135deg, #9c27b0, #e91e63);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
    }
    .btn-cuisines-filter {
      background: linear-gradient(135deg, #ff5722, #ff9800);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-discount {
      background: linear-gradient(135deg, #ff9800, #ffb300);
      color: #111;
      border: none;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-cart-top {
      background: rgba(255, 42, 95, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .search-wrapper { display: flex; gap: 8px; margin: 0 14px 12px; }
    .search-input-box { flex: 1; }
    .search-input-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 16px;
      color: white;
      outline: none;
      font-size: 13px;
    }
    .btn-search {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .zones-bar { display: flex; gap: 8px; margin: 0 14px 10px; }
    .zone-chip {
      flex: 1;
      padding: 9px 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
    }
    .zone-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .horizontal-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 0 14px 10px;
      scrollbar-width: none;
    }
    .horizontal-pills::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill.active-white { background: #ffffff; color: #111; font-weight: 900; border-color: #fff; }
    .pill.active-green { background: var(--accent-green); color: #111; font-weight: 900; border-color: var(--accent-green); }

    .meals-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 4px 14px;
      min-height: 200px;
    }
    .meal-card-talabaty {
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--border-color);
      display: flex;
      padding: 12px;
      gap: 12px;
      align-items: center;
    }
    .meal-card-talabaty.out-of-stock { opacity: 0.65; border-color: rgba(255, 42, 95, 0.35); }
    .talabaty-img-box {
      width: 95px;
      height: 95px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      background: #1a1c24;
    }
    .talabaty-img-box img { width: 100%; height: 100%; object-fit: cover; }
    .btn-quick-add {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      color: var(--primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }
    .talabaty-info-box { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .talabaty-title { font-size: 14px; font-weight: 900; color: #ffffff; }
    .talabaty-desc { font-size: 11px; color: #9aa1b5; }
    .talabaty-rest-tag { font-size: 10px; color: var(--accent-orange); font-weight: 800; }
    .rest-status-pill {
      display: inline-block;
      margin-top: 2px;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      width: fit-content;
    }
    .rest-status-pill.maintenance { background: rgba(255, 152, 0, 0.18); color: #ffb74d; border: 1px solid rgba(255, 152, 0, 0.45); }
    .rest-status-pill.paused { background: rgba(255, 42, 95, 0.18); color: #ff6b8b; border: 1px solid rgba(255, 42, 95, 0.45); }
    .rest-status-pill.no_offers { background: rgba(0, 176, 255, 0.15); color: #80d8ff; border: 1px solid rgba(0, 176, 255, 0.35); }
    .talabaty-pricing { margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .talabaty-main-price { font-size: 14px; font-weight: 900; color: var(--accent-green); }
    .talabaty-old-price { font-size: 11px; color: #8c93a8; text-decoration: line-through; }
    .talabaty-pro-badge {
      background: rgba(156, 39, 176, 0.25);
      border: 1px solid #ab47bc;
      color: #e1bee7;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
    }

    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 26px;
      color: #ff2a5f;
      z-index: 10;
    }

    .float-cart-bar {
      position: fixed;
      bottom: 75px;
      left: 14px;
      right: 14px;
      background: rgba(22, 25, 34, 0.95);
      border: 1.5px solid var(--primary);
      border-radius: 20px;
      padding: 11px 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    .float-cart-bar.show { display: flex; }
    .cart-total-badge { color: var(--accent-green); font-weight: 900; font-size: 15px; }
    .btn-open-vip-cart {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }

    .cart-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 2500;
    }
    .cart-drawer-backdrop.show { display: flex; }
    .cart-drawer-box {
      background: #14161f;
      width: 100%;
      max-width: 520px;
      border-radius: 26px 26px 0 0;
      border: 1.5px solid var(--border-color);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 25px;
    }
    .drawer-header {
      padding: 16px 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .drawer-title { font-size: 17px; font-weight: 900; }
    .btn-close-drawer {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .drawer-body { padding: 14px 18px; overflow-y: auto; flex: 1; }

    .form-input {
      width: 100%;
      background: #191c25;
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 14px;
      color: white;
      margin-bottom: 9px;
      font-size: 13px;
      outline: none;
    }
    .bill-summary-card {
      background: #0f1015;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      font-size: 12px;
      margin-bottom: 14px;
    }
    .bill-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .bill-row.total {
      border-top: 1px dashed rgba(255,255,255,0.15);
      padding-top: 8px;
      margin-top: 8px;
      font-size: 15px;
      font-weight: 900;
      color: var(--accent-green);
    }
    .btn-submit-order-wa {
      width: 100%;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 14px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-box {
      background: #161822;
      width: 100%;
      max-width: 460px;
      border-radius: 24px;
      padding: 20px;
      border: 1.5px solid var(--border-color);
      max-height: 92vh;
      overflow-y: auto;
    }

    .admin-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      background: var(--bg-main);
      padding: 5px;
      border-radius: 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
    }
    .admin-tab-btn.active { background: var(--primary); color: #fff; }
    .admin-tab-content { display: none; }
    .admin-tab-content.active { display: block; }
  </style>
</head>
<body>

<div id="toastBox">✨ تم التحديث بنجاح</div>

<div class="banner-slider-container">
  <div class="banner-slides-track" id="bannerTrack"></div>
  <div class="banner-dots" id="bannerDots"></div>
</div>

<div class="control-header">
  <div class="brand-pill" onclick="handleAdminDoubleTap()">
    <span class="brand-badge">Wj</span> وجباتي
  </div>
  <div class="header-actions">
    <button class="btn-wheel-header" id="btnWheelTrigger" onclick="openWheelModal()">🎡 الحظ</button>
    <button class="btn-cart-top" onclick="openCartDrawer()">🛒 (<span id="cartCountTop">0</span>)</button>
  </div>
</div>

<div class="search-wrapper">
  <div class="search-input-box">
    <input type="text" id="searchInput" placeholder="ابحث عن اسم المطعم أو الوجبة أو المكونات..." oninput="renderMeals()">
  </div>
  <button class="btn-search" onclick="renderMeals()">بحث</button>
</div>

<div class="zones-bar">
  <div class="zone-chip active" onclick="setZone('الكل', this)">كل بغداد / All</div>
  <div class="zone-chip" onclick="setZone('الكرخ', this)">الكرخ / Karkh</div>
  <div class="zone-chip" onclick="setZone('الرصافة', this)">الرصافة / Rusafa</div>
</div>

<div class="horizontal-pills" id="restaurantsBar"></div>
<div class="horizontal-pills" id="categoriesBar"></div>
<div class="meals-grid" id="mealsGrid"></div>

<div class="float-cart-bar" id="floatCartBar">
  <div>
    <span id="cartTotalItems" style="font-weight:900;">0</span> وجبات |
    <span class="cart-total-badge" id="cartTotalSum">0 د.ع</span>
  </div>
  <button class="btn-open-vip-cart" onclick="openCartDrawer()">معاينة سلة وجباتي 👈</button>
</div>

<!-- نافذة عجلة الحظ -->
<div class="modal-backdrop" id="wheelModal" onclick="if(event.target.id==='wheelModal')closeWheelModal()">
  <div class="modal-box" style="max-width:350px; text-align:center;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h3 style="margin:0; font-size:16px;">🎡 عجلة الحظ والهدايا</h3>
      <span style="font-size:20px; cursor:pointer;" onclick="closeWheelModal()">✕</span>
    </div>
    <p style="font-size:11px; color:var(--text-muted); margin-bottom:12px;">
      دور العجلة مرة واحدة وإرسال هديتك فوراً إلى <strong id="wheelRestBadge" style="color:var(--accent-orange);">مطعم سندريلا</strong>!
    </p>
    <div style="position:relative; width:260px; height:260px; margin:0 auto 15px;">
      <div class="wheel-pointer">▼</div>
      <canvas id="wheelCanvas" width="260" height="260" style="border-radius:50%;"></canvas>
    </div>
    <button type="button" class="btn-discount" id="btnSpinWheel" style="width:100%; padding:13px; font-weight:900; font-size:14px; background:linear-gradient(135deg, #00e676, #00b0ff); color:#111;" onclick="spinWheel()">
      🎯 تدوير العجلة الآن!
    </button>
    <div id="wheelResultBox" style="display:none; margin-top:12px; padding:10px; border-radius:12px; background:rgba(0,230,118,0.15); border:1px solid var(--accent-green); font-size:12px; font-weight:800; line-height:1.5;"></div>
  </div>
</div>

<!-- سلة المشتريات -->
<div class="cart-drawer-backdrop" id="cartDrawer" onclick="if(event.target.id==='cartDrawer')closeCartDrawer()">
  <div class="cart-drawer-box">
    <div class="drawer-header">
      <h3 class="drawer-title">🛒 سلة وجباتي</h3>
      <button class="btn-close-drawer" onclick="closeCartDrawer()">✕</button>
    </div>
    <div class="drawer-body">
      <div id="drawerItemsList" style="margin-bottom:14px;"></div>
      <input type="text" id="custName" class="form-input" placeholder="اسم الزبون الكامل">
      <input type="tel" id="custPhone" class="form-input" placeholder="رقم الهاتف (077XXXXXXXX)">
      <input type="text" id="custAddress" class="form-input" placeholder="العنوان بالتفصيل - نقطة دالة">
      <select id="custZoneSelect" class="form-input" onchange="updateCartUI(); renderCartDrawerContent();">
        <option value="الكرخ">جانب الكرخ</option>
        <option value="الرصافة">جانب الرصافة</option>
      </select>
      <div class="bill-summary-card" id="billSummaryCard"></div>
      <button type="button" class="btn-submit-order-wa" id="submitBtn" onclick="submitFullOrder()">
        💬 إرسال الطلب لواتساب مباشرة
      </button>
    </div>
  </div>
</div>

<!-- لوحة الإدارة العامة VIP -->
<div class="modal-backdrop" id="adminPanelModal" onclick="if(event.target.id==='adminPanelModal')closeAdminPanel()">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
      <h3 style="margin:0; font-size:16px; color:#fff;">⚙️ إدارة وجباتي السحابية VIP</h3>
      <span style="font-size:20px; cursor:pointer; color:var(--text-muted);" onclick="closeAdminPanel()">✕</span>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab-btn active" onclick="switchAdminTab('privacyPhoneTab', this)">🙈 إخفاء رقم المطعم</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('editRestTab', this)">✏️ تعديل مطعم</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('wheelAdminTab', this)">🎡 عجلة الحظ</button>
    </div>

    <!-- تبويب إخفاء رقم المطعم عند إرسال الواتساب -->
    <div id="privacyPhoneTab" class="admin-tab-content active">
      <div style="background:var(--bg-card); padding:12px; border-radius:14px; border:1px solid var(--border-color); margin-bottom:10px;">
        <label style="font-size:12px; font-weight:800; color:var(--accent-orange); display:block; margin-bottom:6px;">
          طريقة إرسال الطلبات والهدايا عبر واتساب:
        </label>
        <select id="admHidePhoneMode" class="form-input" onchange="toggleRelayPhoneInput()">
          <option value="hide_number_text">إخفاء رقم المطعم من نص الرسالة (إرسال مباشر بدون إظهار الرقم)</option>
          <option value="relay_number">توجيه الطلب إلى رقم وسيط (المكتب/الإدارة) بدون إظهار رقم المطعم</option>
          <option value="show_normal">إظهار البيانات بشكل طبيعي</option>
        </select>

        <div id="relayPhoneBox" style="display:none; margin-top:6px;">
          <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px;">رقم الواتساب الوسيط (مثال: 96477XXXXXXXX):</label>
          <input type="tel" id="admRelayPhoneInput" class="form-input" placeholder="96477XXXXXXXX">
        </div>

        <button type="button" class="btn-discount" style="width:100%; padding:12px; font-weight:900; background:linear-gradient(135deg, #00e676, #00b0ff); color:#111; margin-top:8px;" onclick="saveWhatsappPrivacySettings()">
          💾 حفظ إعدادات إخفاء الرقم سحابياً
        </button>
      </div>
    </div>

    <!-- تبويب تعديل مطعم -->
    <div id="editRestTab" class="admin-tab-content">
      <div style="background:var(--bg-card); padding:12px; border-radius:14px; border:1px solid var(--border-color);">
        <label style="font-size:11px; font-weight:800; color:var(--accent-orange); display:block; margin-bottom:4px;">اختر مطعماً مشتركاً:</label>
        <select id="editRestSelect" class="form-input" onchange="loadSelectedRestaurantForEdit()"></select>
        <input type="text" id="editRestNameInput" class="form-input" placeholder="اسم المطعم">

function normalizePhoneIraq(rawPhone) {
  let clean = String(rawPhone || "").replace(/\D/g, '');

}

function resolveWhatsappTargetPhone(restName) {

  const key = Object.keys(REST_PHONES || {}).find(k => k.toLowerCase().trim() === String(restName || "").toLowerCase().trim());
  const restPhone = key ? REST_PHONES[key] : "9647708111561";

}

function getWheelLockKey() {
  const restKey = String(wheelConfig?.restaurant || "default").trim().toLowerCase();
  const itemsKey = JSON.stringify(wheelConfig?.items || []);
  return `wj_wheel_used_${restKey}_${itemsKey.length}`;

function isWheelLockedOnce() {
  try {
    return localStorage.getItem(getWheelLockKey()) === "1";
  } catch (e) {
    return false;
  }
}

function lockWheelOnce() {
  try {

}

function updateWheelVisibilityUI() {

const WHEEL_COLORS = ["#ff2a5f", "#ff9800", "#00e676", "#00b0ff", "#9c27b0", "#ff5722", "#e91e63", "#4caf50"];

function drawLuckyWheel() {
  const canvas = document.getElementById("wheelCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const items = (wheelConfig && wheelConfig.items && wheelConfig.items.length > 0) ? wheelConfig.items : ["جائزة 1", "جائزة 2"];
  const numSlices = items.length;
  const arcSize = (2 * Math.PI) / numSlices;
  const radius = canvas.width / 2;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < numSlices; i++) {
    const angle = currentWheelAngle + (i * arcSize);
    ctx.beginPath();
    ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, angle, angle + arcSize);
    ctx.lineTo(radius, radius);
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(angle + arcSize / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 11px system-ui";
    ctx.fillText(items[i], radius - 15, 4);
    ctx.restore();
  }
}

async function sendWheelPrizeToRestaurantImmediately(winningItem, restName) {

    timeZone: "Asia/Baghdad",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",

  });

  try {
    await fetch(FIREBASE_ORDERS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: giftId,

        date: nowStr,

        phone: custPhone,

function spinWheel() {
  if (isSpinning || isWheelLockedOnce()) return;
  isSpinning = true;
  lockWheelOnce();

  const btn = document.getElementById("btnSpinWheel");
  const resBox = document.getElementById("wheelResultBox");
  btn.disabled = true;
  btn.style.opacity = "0.55";
  btn.innerText = "⏳ جاري التدوير...";
  resBox.style.display = "none";

  const items = wheelConfig.items || [];
  const numSlices = items.length;
  const arcSize = (2 * Math.PI) / numSlices;
  const fullRotations = 5 + Math.floor(Math.random() * 3);
  const randomExtra = Math.random() * 2 * Math.PI;
  const totalTargetRotation = (fullRotations * 2 * Math.PI) + randomExtra;

  const duration = 3500;
  const startTime = performance.now();
  const startAngle = currentWheelAngle;

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    currentWheelAngle = startAngle + (totalTargetRotation * ease);
    drawLuckyWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      btn.innerText = "🔒 أُغلقت العجلة (مرة واحدة فقط)";
      const normalizedAngle = (currentWheelAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const pointerAngle = (3 * Math.PI / 2);
      let winningIndex = Math.floor((pointerAngle - normalizedAngle + 2 * Math.PI) % (2 * Math.PI) / arcSize);
      winningIndex = (winningIndex + numSlices) % numSlices;

      const winningItem = items[winningIndex];
      const targetRest = wheelConfig.restaurant || "مطعم سندريلا";

      if (winningItem.includes("حظ أوفر")) {
        resBox.style.background = "rgba(255,42,95,0.15)";
        resBox.style.borderColor = "var(--primary)";
        resBox.innerHTML = `😢 حظ أوفر هذه المرة!<br><span style="font-size:11px; font-weight:700;">تم إقفال العجلة لأن المحاولة مسموحة لمرة واحدة فقط.</span>`;
        resBox.style.display = "block";
      } else {
        resBox.style.background = "rgba(0,230,118,0.15)";
        resBox.style.borderColor = "var(--accent-green)";
        resBox.innerHTML = `🎉 مبروك! ربحت <strong>(${winningItem})</strong>.<br><span style="color:#fff; font-size:11px;">جاري التحويل للواتساب فوراً...</span>`;
        resBox.style.display = "block";
        sendWheelPrizeToRestaurantImmediately(winningItem, targetRest);
      }
    }
  }
  requestAnimationFrame(animate);
}

function getRestaurantStatusInfo(restName) {
  const key = Object.keys(restStatuses || {}).find(k => k.toLowerCase().trim() === String(restName || "").toLowerCase().trim());
  const code = key ? restStatuses[key] : "active";
  if (code === "maintenance") return { code, label: "في صيانة 🔧", cssClass: "maintenance", blockOrder: true };
  if (code === "paused") return { code, label: "متوقف مؤقتاً ⏸️", cssClass: "paused", blockOrder: true };
  if (code === "no_offers") return { code, label: "لا يوجد عروض حالياً 🏷️", cssClass: "no_offers", blockOrder: false };
  return { code: "active", label: "مشترك وفعال ✅", cssClass: "", blockOrder: false };
}

function renderMeals() {
  const query = (document.getElementById("searchInput")?.value || "").trim().toLowerCase();
  const grid = document.getElementById("mealsGrid");
  if (!grid) return;

  const filtered = allMeals.filter(m => {
    const matchZone = selectedZone === "الكل" || m.zone === selectedZone;
    const matchRest = selectedRest === "الكل" || (m.rest && m.rest.toLowerCase().trim() === selectedRest.toLowerCase().trim());
    const matchCat = selectedCat === "الكل" || m.cat === selectedCat;
    const matchQuery = !query || m.name.toLowerCase().includes(query) || (m.rest && m.rest.toLowerCase().includes(query));
    return matchZone && matchRest && matchCat && matchQuery;
  });

  grid.innerHTML = filtered.map(m => {
    const st = getRestaurantStatusInfo(m.rest);
    const isAvailable = (m.available !== false) && !st.blockOrder;
    const hasSaving = (m.savingPrice && Number(m.savingPrice) > 0 && Number(m.savingPrice) < Number(m.price)) && st.code !== "no_offers";
    return `
      <div class="meal-card-talabaty ${!isAvailable ? 'out-of-stock' : ''}">
        <div class="talabaty-img-box">
          <img src="${m.img}" alt="${m.name}" loading="lazy">
          ${isAvailable ? `<button class="btn-quick-add" onclick="addToCart('${m.id}')">+</button>` : ''}
        </div>
        <div class="talabaty-info-box">
          <div class="talabaty-title">${m.name}</div>
          <div class="talabaty-desc">${m.desc || ''}</div>
          <div class="talabaty-rest-tag">🏪 ${m.rest}</div>
          ${st.code !== "active" ? `<span class="rest-status-pill ${st.cssClass}">${st.label}</span>` : ''}
          <div class="talabaty-pricing">
            ${hasSaving ? `
              <span class="talabaty-main-price">${money(m.savingPrice)}</span>
              <span class="talabaty-old-price">${money(m.price)}</span>
              <span class="talabaty-pro-badge">توفير 🔥</span>
            ` : `<span class="talabaty-main-price">${money(m.price)}</span>`}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function buildRestaurantsBar() {
  const rests = ["الكل", ...RESTS];
  const rBar = document.getElementById("restaurantsBar");

  rBar.innerHTML = rests.map(r => `
    <div class="pill ${r.toLowerCase() === selectedRest.toLowerCase() ? 'active-white' : ''}" onclick="setRestaurant('${r.replace(/'/g, "\\'")}', this)">
      ${r === 'الكل' ? 'كل المطاعم' : r}

  `).join('');
}

function buildCategoriesBar() {
  const cBar = document.getElementById("categoriesBar");
  if (!cBar) return;
  const cats = ["الكل", ...new Set(allMeals.map(m => m.cat).filter(Boolean))];
  cBar.innerHTML = cats.map(c => `

function setRestaurant(rest, el = null) {
  selectedRest = rest;
  selectedCat = "الكل";

  if (el) el.classList.add('active-white');
  buildCategoriesBar();
  renderMeals();

function setCategory(cat, el) {
  selectedCat = cat;
  document.querySelectorAll('#categoriesBar .pill').forEach(c => c.classList.remove('active-green'));
  el.classList.add('active-green');
  renderMeals();
}

function addToCart(mealId) {
  const meal = allMeals.find(item => String(item.id) === String(mealId));
  if (!meal) return;
  const st = getRestaurantStatusInfo(meal.rest);
  if (st.blockOrder) {
    showToast(`⚠️ ${meal.rest}: ${st.label}`);
    return;
  }
  const unitPrice = (meal.savingPrice && Number(meal.savingPrice) > 0 && st.code !== "no_offers") ? Number(meal.savingPrice) : Number(meal.price);
  const existing = cart.find(item => String(item.id) === String(mealId));
  if (existing) existing.qty += 1;
  else cart.push({ ...meal, actualPrice: unitPrice, qty: 1 });
  updateCartUI();
  showToast(`🍔 أضيفت: ${meal.name}`);
}

function updateCartUI() {
  const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
  const subtotal = cart.reduce((sum, item) => sum + (item.actualPrice * item.qty), 0);
  const grandTotal = subtotal > 0 ? subtotal + orderDeliveryFee : 0;

  document.getElementById("cartCountTop").innerText = totalCount;
  document.getElementById("cartTotalItems").innerText = totalCount;
  document.getElementById("cartTotalSum").innerText = money(grandTotal);

  const bar = document.getElementById("floatCartBar");
  if (bar) {
    if (totalCount > 0) bar.classList.add("show");
    else bar.classList.remove("show");
  }
}

function openCartDrawer() {
  document.getElementById("cartDrawer").classList.add("show");
  renderCartDrawerContent();
}
function closeCartDrawer() { document.getElementById("cartDrawer").classList.remove("show"); }

function renderCartDrawerContent() {
  const listEl = document.getElementById("drawerItemsList");
  const billEl = document.getElementById("billSummaryCard");
  if (!listEl || !billEl) return;

  listEl.innerHTML = cart.map(item => `
    <div style="background:var(--bg-card); padding:10px 12px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:13px; font-weight:800;">${item.name} × ${item.qty}</div>
        <div style="font-size:11px; color:var(--accent-orange);">${item.rest}</div>
      </div>
      <div style="font-size:13px; font-weight:900; color:var(--accent-green);">${money(item.actualPrice * item.qty)}</div>
    </div>
  `).join('');

  const subtotal = cart.reduce((sum, item) => sum + (item.actualPrice * item.qty), 0);
  const total = subtotal > 0 ? subtotal + orderDeliveryFee : 0;

  billEl.innerHTML = `
    <div class="bill-row"><span>المجموع الفرعي:</span><span>${money(subtotal)}</span></div>
    <div class="bill-row"><span>أجرة التوصيل:</span><span>${money(orderDeliveryFee)}</span></div>
    <div class="bill-row total"><span>الإجمالي النهائي:</span><span>${money(total)}</span></div>
  `;
}

function submitFullOrder() {
  if (!cart.length) return;
  const custName = document.getElementById("custName")?.value.trim() || "زبون وجباتي";
  const custPhone = document.getElementById("custPhone")?.value.trim() || "غير محدد";
  const custAddr = document.getElementById("custAddress")?.value.trim() || "غير محدد";
  const zone = document.getElementById("custZoneSelect")?.value || "الكرخ";
  const primaryRest = cart[0]?.rest || "مطعم سندريلا";
  const targetWaPhone = resolveWhatsappTargetPhone(primaryRest);

  const itemsText = cart.map(i => `• ${i.name} (${i.qty}) = ${money(i.actualPrice * i.qty)}`).join("\n");
  const subtotal = cart.reduce((sum, item) => sum + (item.actualPrice * item.qty), 0);
  const total = subtotal + orderDeliveryFee;

  const restLine = waPrivacyConfig?.mode === "relay_number"
    ? `الطلب موجه عبر الإدارة إلى: *${primaryRest}*\n`
    : `الطلب إلى: *${primaryRest}*\n`;

  const msg =
    `*🍔 طلب جديد من تطبيق وجباتي*\n\n` +
    restLine +
    `الزبون: *${custName}*\n` +
    `هاتف الزبون: *${custPhone}*\n` +
    `المنطقة / العنوان: *${zone} - ${custAddr}*\n\n` +
    `*الوجبات:*\n${itemsText}\n\n` +
    `*الإجمالي:* ${money(total)}`;

  window.location.assign(`https://api.whatsapp.com/send?phone=${targetWaPhone}&text=${encodeURIComponent(msg)}`);
}

function switchAdminTab(tabId, btnEl) {
  document.querySelectorAll(".admin-tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".admin-tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(tabId)?.classList.add("active");
  btnEl?.classList.add("active");
  if (tabId === "editRestTab") populateEditRestaurantDropdown();
  if (tabId === "privacyPhoneTab") populatePrivacySettingsUI();
}

function handleAdminDoubleTap() {
  document.getElementById("adminPanelModal").classList.add("show");
  populatePrivacySettingsUI();
  populateEditRestaurantDropdown();
}

function closeAdminPanel() { document.getElementById("adminPanelModal").classList.remove("show"); }

function populateEditRestaurantDropdown() {
  const sel = document.getElementById("editRestSelect");
  if (!sel) return;
  sel.innerHTML = RESTS.map(r => `<option value="${r.replace(/"/g, '&quot;')}">${r}</option>`).join('');
  loadSelectedRestaurantForEdit();
}

function loadSelectedRestaurantForEdit() {
  const restName = document.getElementById("editRestSelect")?.value;
  if (!restName) return;
  document.getElementById("editRestNameInput").value = restName;
  document.getElementById("editRestPhoneInput").value = REST_PHONES[restName] || "";
  document.getElementById("editRestStatusSelect").value = getRestaurantStatusInfo(restName).code;
}

async function saveEditedRestaurant() {
  const oldName = document.getElementById("editRestSelect")?.value;
  const newName = (document.getElementById("editRestNameInput")?.value || "").trim();
  const phone = normalizePhoneIraq(document.getElementById("editRestPhoneInput")?.value || "");
  const status = document.getElementById("editRestStatusSelect")?.value || "active";
  if (!oldName || !newName) return;

  RESTS = RESTS.map(r => r === oldName ? newName : r);
  if (oldName !== newName) {
    delete REST_PHONES[oldName];
    delete restStatuses[oldName];
    allMeals = allMeals.map(m => m.rest === oldName ? { ...m, rest: newName } : m);
  }
  REST_PHONES[newName] = phone || REST_PHONES[newName] || "9647708111561";
  restStatuses[newName] = status;

  try {
    await Promise.all([
      fetch(FIREBASE_RESTS_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(RESTS) }),
      fetch(FIREBASE_PHONES_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(REST_PHONES) }),
      fetch(FIREBASE_REST_STATUS_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(restStatuses) })
    ]);
  } catch (e) {}

  buildRestaurantsBar();
  renderMeals();
  showToast(`✅ تم حفظ تعديلات "${newName}"`);
}

function saveWheelConfigToCloud() {
  wheelConfig.active = document.getElementById("admWheelActive").value === "1";
  fetch(FIREBASE_WHEEL_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(wheelConfig)
  });
  updateWheelVisibilityUI();
  showToast("🎡 تم حفظ إعدادات العجلة");
}

function renderBanners() {
  const track = document.getElementById("bannerTrack");
  const dots = document.getElementById("bannerDots");
  if (!track || !dots) return;
  track.innerHTML = `<div class="banner-slide"><img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=1200" alt="وجباتي"><div class="banner-overlay"><h2>🍔 وجباتي VIP</h2><p>أقوى المطاعم وأشهى عروض التوفير</p></div></div>`;
  dots.innerHTML = `<div class="banner-dot active"></div>`;
}

async function syncQuietlyWithCloud() {
  try {
    const [resPr, resSt, resPh] = await Promise.all([
      fetch(FIREBASE_WA_PRIVACY_URL + "?_t=" + Date.now(), { cache: "no-store" }),
      fetch(FIREBASE_REST_STATUS_URL + "?_t=" + Date.now(), { cache: "no-store" }),
      fetch(FIREBASE_PHONES_URL + "?_t=" + Date.now(), { cache: "no-store" })
    ]);
    const pr = await resPr.json();
    if (pr && typeof pr === "object") waPrivacyConfig = { ...waPrivacyConfig, ...pr };
    const st = await resSt.json();
    if (st && typeof st === "object") restStatuses = st;
    const ph = await resPh.json();
    if (ph && typeof ph === "object") REST_PHONES = { ...REST_PHONES, ...ph };
    renderMeals();
  } catch (e) {}
}

window.onload = () => {
  renderBanners();
  buildRestaurantsBar();
  buildCategoriesBar();
  populateEditRestaurantDropdown();
  populatePrivacySettingsUI();
  renderMeals();
  updateCartUI();
  updateWheelVisibilityUI();
  drawLuckyWheel();
  syncQuietlyWithCloud();
};
</script>
</body>
